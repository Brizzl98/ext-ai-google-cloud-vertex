# Release archives are built from a fresh checkout after the tests pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    outputs:
      archive_artifact_id:
        value: ${{ jobs.package.outputs.archive_artifact_id }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-test.txt
          python -m pip install --no-index --no-deps dev-wheels/flowsteward_extension_sdk-*.whl
      - name: Repository workflow contracts
        run: python -m pytest -q -p no:cacheprovider .github/tests
      - name: Extension tests
        run: python -m pytest -q -p no:cacheprovider tests

  package:
    needs: tests
    runs-on: ubuntu-24.04
    outputs:
      archive_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package the archive and record its digest
        run: |
          python3 .github/scripts/package_extension.py
          (cd dist && sha256sum -- *.zip > SHA256SUMS)
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  validate:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the locked catalog dependency
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-catalog.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.archive_artifact_id }}
          path: dist
      - name: Verify and validate a copy of the published artifact
        run: |
          (cd dist && sha256sum --check --strict SHA256SUMS)
          chmod a-w dist dist/*.zip
          python .github/scripts/catalog_check.py dist/*.zip
